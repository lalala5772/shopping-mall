# 이 파일은 base 이미지의 http {} 블록 안에서 include 되므로 http 컨텍스트 지시어를 여기 둬도 된다.
# EC2 퍼블릭 DNS 호스트명이 nginx 기본 해시 버킷 크기(32~64바이트)보다 길어서
# server_names_hash_bucket_size를 안 늘리면 "could not build server_names_hash" 에러로
# nginx 자체가 기동을 못 한다(재시작을 반복하며 아예 응답 없음 상태가 됨 - 실제로 겪은 장애).
server_names_hash_bucket_size 128;

# 정식 호스트명이 아닌 경로(퍼블릭 IP 직접 접근 등)로 들어온 요청은 전부 정식 호스트명으로
# 301 리다이렉트한다. 구글 OAuth는 IP 주소 기반 redirect_uri를 보안 정책 위반으로 그 자리에서
# 거부(400 invalid_request)하기 때문에, 로그인 플로우가 항상 같은 호스트명에서 시작하도록
# 강제하지 않으면 IP로 접속한 사용자는 구글 로그인 자체를 못 한다.
server {
    listen 80 default_server;
    server_name _;

    # Let's Encrypt 갱신용 HTTP-01 challenge는 리다이렉트보다 먼저 매치되어야 한다 -
    # certbot이 검증 요청을 보낼 때 Host 헤더가 항상 정식 호스트명인 건 아니라서, 이 catch-all
    # 서버 블록에도 동일하게 열어둔다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 http://ec2-43-200-176-234.ap-northeast-2.compute.amazonaws.com$request_uri;
    }
}

server {
    listen 80;
    server_name ec2-43-200-176-234.ap-northeast-2.compute.amazonaws.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # nginx 기본값(1MB)은 이미지 업로드(상품 이미지 검색 등)에는 너무 작다.
    # 애플리케이션 쪽 multipart 상한(application.yml max-file-size 10MB)과 맞춰둔다.
    client_max_body_size 12m;

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
