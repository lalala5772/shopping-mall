version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: shop-mysql
    restart: unless-stopped
    # 프리티어(RAM 1GB급) 인스턴스에서 mysql/app/nginx가 한 호스트에 같이 뜨기 때문에
    # 컨테이너별 메모리 상한을 걸어둔다 - 상한이 없으면 컨테이너 하나가 폭주할 때
    # 호스트 전체가 스와핑/OOM으로 응답 불능에 빠질 수 있다.
    mem_limit: 320m
    command: --performance-schema=OFF --innodb-buffer-pool-size=96M
    environment:
      MYSQL_DATABASE: shopping_mall
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - internal
    # 운영에서는 포트를 호스트에 노출하지 않는다 (app 컨테이너만 내부망으로 접근)
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    # 아직 이미지 레지스트리 파이프라인이 없어 저장소의 Dockerfile로 서버에서 직접 빌드한다.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shop-app
    restart: unless-stopped
    mem_limit: 380m
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shopping_mall?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      # 값은 .env(서버 로컬, git 미포함)로만 주입한다. 비어 있으면 SecurityConfig가 자동으로
      # oauth2Login()을 등록하지 않으므로, 구글 로그인 없이도 앱은 정상 기동한다.
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # 이미지 유사도 검색(Bedrock). 자격증명은 코드/컨테이너에 넣지 않고 EC2 인스턴스 프로필(IAM 역할)의
      # 메타데이터 서비스를 통해 AWS SDK 기본 체인이 자동으로 가져간다.
      APP_BEDROCK_ENABLED: ${APP_BEDROCK_ENABLED:-false}
      APP_BEDROCK_REGION: ${APP_BEDROCK_REGION:-us-east-1}
      # 도로명주소 검색 / 스마트택배 배송조회. 로컬은 application-local.yml(gitignore)로
      # 값이 들어가지만, 그 파일은 서버로 배포되지 않으므로 여기서 별도로 주입해야 한다 -
      # 안 하면 두 값 다 빈 문자열 기본값이 되어 각 기능이 "키 미설정"으로 조용히 비활성화된다.
      APP_JUSO_CONFIRM_KEY: ${JUSO_CONFIRM_KEY:-}
      APP_DELIVERY_TRACKING_API_KEY: ${DELIVERY_TRACKING_API_KEY:-}
    networks:
      - internal
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    container_name: shop-nginx
    restart: unless-stopped
    mem_limit: 60m
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  mysql-data:
