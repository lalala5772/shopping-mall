<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>주소 선택</title>
</head>
<body>
<p style="font-family:sans-serif; font-size:0.9rem; padding:1rem;">주소를 반영하는 중입니다...</p>
<script th:inline="javascript">
  /*<![CDATA[*/
  var roadAddr = /*[[${roadAddr}]]*/ '';
  var zipNo = /*[[${zipNo}]]*/ '';
  var detailAddr = /*[[${detailAddr}]]*/ '';

  if (window.opener) {
    window.opener.postMessage({
      source: 'juso-address-search',
      roadAddr: roadAddr,
      zipNo: zipNo,
      detailAddr: detailAddr
    }, window.location.origin);
    window.close();
  } else {
    document.body.innerText = '이 창은 부모 창 없이 열려서 자동으로 닫을 수 없습니다. 직접 닫아 주세요.';
  }
  /*]]>*/
</script>
</body>
</html>
