<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">미르옷장</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="site-header">
    <div class="container site-header__inner">
        <a class="brand" th:href="@{/}">미르옷장</a>
        <nav class="main-nav">
            <a th:href="@{/products}">Shop</a>
            <th:block sec:authorize="!isAuthenticated()">
                <a th:href="@{/members/register}">Join</a>
                <a th:href="@{/login}">Login</a>
            </th:block>
            <th:block sec:authorize="isAuthenticated()">
                <a th:href="@{/mypage/orders}">My Page</a>
                <th:block sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/admin/dashboard}">대시보드</a>
                    <a th:href="@{/admin/products}">상품관리</a>
                    <a th:href="@{/admin/orders}">주문관리</a>
                </th:block>
                <form th:action="@{/logout}" method="post" style="display:inline">
                    <button type="submit" class="link-button" style="background:none;border:none;font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;padding:0;">Logout</button>
                </form>
            </th:block>
            <a th:href="@{/cart}" class="icon-link" aria-label="Cart">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
                <span class="cart-badge" th:if="${cartCount != null and cartCount > 0}" th:text="${cartCount}">0</span>
            </a>
        </nav>
    </div>
</header>

<main>
    <div class="container">
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}">success</div>
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}">error</div>
        <div layout:fragment="content">
            <!-- 각 페이지 콘텐츠가 여기에 삽입된다 -->
        </div>
    </div>
</main>

<footer class="site-footer">
    <div class="container site-footer__inner">
        <div class="site-footer__brand">
            <p class="site-footer__logo">미르옷장</p>
            <p class="site-footer__meta">
                대표: 이미르&nbsp;&nbsp;|&nbsp;&nbsp;사업자등록번호: 000-00-00000&nbsp;&nbsp;|&nbsp;&nbsp;통신판매업신고: 제0000-서울강남-0000호<br>
                주소: 서울특별시 강남구 테헤란로 1&nbsp;&nbsp;|&nbsp;&nbsp;고객센터: 00-0000-0000 (평일 10:00-17:00, 점심 12:00-13:00)
            </p>
            <p class="site-footer__links">
                <a th:href="@{/}">이용약관</a><span>·</span><a th:href="@{/}">개인정보처리방침</a>
            </p>
        </div>
        <div class="site-footer__social">
            <a href="#" aria-label="Instagram">Instagram</a>
            <a href="#" aria-label="Facebook">Facebook</a>
        </div>
    </div>
    <div class="container site-footer__copyright">&copy; 2026 미르옷장. All rights reserved.</div>
</footer>

</body>
</html>
