<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head><title>로그인</title></head>
<body>
<div layout:fragment="content">

    <div class="form-page">
        <h1>Login</h1>

        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}">error</div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="email">이메일</label>
                <input type="email" id="email" name="email" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-block">로그인</button>
        </form>

        <div class="oauth-divider"><span>또는</span></div>
        <a th:href="@{/oauth2/authorization/google}" class="btn btn-outline btn-block">Google로 로그인</a>

        <p class="form-footer-link">
            아직 회원이 아니신가요? <a th:href="@{/members/register}">회원가입</a>
        </p>
        <p class="form-footer-link muted" style="font-size:0.75rem;">
            관리자 데모 계정: admin@mirocloset.com / admin1234!
        </p>
    </div>

</div>
</body>
</html>
