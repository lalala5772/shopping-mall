<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head><title>주문 완료</title></head>
<body>
<div layout:fragment="content">

    <div class="text-center" style="padding: var(--space-5) 0;">
        <h1 style="font-family:var(--font-serif); font-size:1.8rem;">주문이 완료되었습니다</h1>
        <p class="muted">주문번호 <strong th:text="${order.orderNumber}">ORD-0000</strong></p>
    </div>

    <table class="cart-table">
        <thead><tr><th>상품</th><th>단가</th><th>수량</th><th>합계</th></tr></thead>
        <tbody>
        <tr th:each="item : ${order.items}">
            <td th:text="${item.productName}">상품명</td>
            <td th:text="${#numbers.formatInteger(item.price, 0, 'COMMA')} + '원'">0원</td>
            <td th:text="${item.quantity}">1</td>
            <td th:text="${#numbers.formatInteger(item.totalPrice, 0, 'COMMA')} + '원'">0원</td>
        </tr>
        </tbody>
    </table>

    <div class="cart-summary">
        <span>총 결제금액</span>
        <strong th:text="${#numbers.formatInteger(order.totalPrice, 0, 'COMMA')} + '원'">0원</strong>
    </div>

    <p><strong>배송지</strong><br>
        <span th:text="${order.receiverName}">수령인</span> /
        <span th:text="${order.receiverPhone}">연락처</span><br>
        <span th:text="${order.receiverAddress}">주소</span>
    </p>

    <a th:href="@{/products}" class="btn btn-block">쇼핑 계속하기</a>

</div>
</body>
</html>
