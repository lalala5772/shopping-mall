<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head><title>대시보드</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <h1>대시보드</h1>
    </div>

    <div class="stat-grid">
        <div class="stat-card">
            <span class="stat-card__label">총 매출 (취소 제외)</span>
            <strong class="stat-card__value" th:text="${#numbers.formatInteger(summary.totalRevenue, 0, 'COMMA')} + '원'">0원</strong>
        </div>
        <div class="stat-card">
            <span class="stat-card__label">총 주문 건수</span>
            <strong class="stat-card__value" th:text="${summary.totalOrders} + '건'">0건</strong>
        </div>
        <div class="stat-card">
            <span class="stat-card__label">오늘 매출</span>
            <strong class="stat-card__value" th:text="${#numbers.formatInteger(summary.todayRevenue, 0, 'COMMA')} + '원'">0원</strong>
        </div>
        <div class="stat-card">
            <span class="stat-card__label">오늘 주문</span>
            <strong class="stat-card__value" th:text="${summary.todayOrders} + '건'">0건</strong>
        </div>
        <div class="stat-card">
            <span class="stat-card__label">평균 주문 금액</span>
            <strong class="stat-card__value" th:text="${#numbers.formatInteger(summary.averageOrderValue, 0, 'COMMA')} + '원'">0원</strong>
        </div>
        <div class="stat-card">
            <span class="stat-card__label">취소 건수</span>
            <strong class="stat-card__value accent" th:text="${summary.cancelledOrders} + '건'">0건</strong>
        </div>
    </div>

    <div class="dashboard-grid">
        <div class="dashboard-panel">
            <h2>최근 14일 매출 추이</h2>
            <canvas id="trendChart" height="90"></canvas>
        </div>
        <div class="dashboard-panel">
            <h2>주문 상태별 분포</h2>
            <canvas id="statusChart" height="90"></canvas>
            <div th:if="${#lists.isEmpty(statusBreakdown)}" class="empty-state">데이터가 없습니다.</div>
        </div>
    </div>

    <div class="dashboard-panel">
        <h2>인기 상품 TOP 5 (판매 수량 기준)</h2>
        <div th:if="${#lists.isEmpty(topProducts)}" class="empty-state">아직 판매된 상품이 없습니다.</div>
        <div class="data-table-wrap" th:unless="${#lists.isEmpty(topProducts)}">
            <table class="data-table">
                <thead>
                <tr><th>순위</th><th>상품명</th><th class="num">판매 수량</th><th class="num">누적 매출</th></tr>
                </thead>
                <tbody>
                <tr th:each="p, iter : ${topProducts}">
                    <td th:text="${iter.count}">1</td>
                    <td th:text="${p.productName}">상품명</td>
                    <td class="num" th:text="${p.quantity} + '개'">0개</td>
                    <td class="num" th:text="${#numbers.formatInteger(p.revenue, 0, 'COMMA')} + '원'">0원</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        var trendLabels = /*[[${dailyTrend.![date]}]]*/ [];
        var trendRevenue = /*[[${dailyTrend.![revenue]}]]*/ [];
        var statusLabels = /*[[${statusBreakdown.![label]}]]*/ [];
        var statusCounts = /*[[${statusBreakdown.![count]}]]*/ [];

        new Chart(document.getElementById('trendChart'), {
            type: 'line',
            data: {
                labels: trendLabels,
                datasets: [{
                    label: '매출',
                    data: trendRevenue,
                    borderColor: '#1a1a1a',
                    backgroundColor: 'rgba(26,26,26,0.06)',
                    fill: true,
                    tension: 0.25,
                    pointRadius: 2
                }]
            },
            options: {
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, ticks: { callback: function (v) { return v.toLocaleString() + '원'; } } }
                }
            }
        });

        new Chart(document.getElementById('statusChart'), {
            type: 'doughnut',
            data: {
                labels: statusLabels,
                datasets: [{
                    data: statusCounts,
                    backgroundColor: ['#1a1a1a', '#2980b9', '#1f6f4a', '#b3261e']
                }]
            },
            options: {
                plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } }
            }
        });
        /*]]>*/
    </script>

</div>
</body>
</html>
