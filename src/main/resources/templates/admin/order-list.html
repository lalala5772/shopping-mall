<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head><title>주문 관리</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <h1>주문 관리</h1>
    </div>

    <div class="filter-bar">
        <a th:href="@{/admin/orders}" class="filter-chip" th:classappend="${selectedStatus == null} ? ' active'">전체</a>
        <a th:each="s : ${statuses}"
           th:href="@{/admin/orders(status=${s})}"
           class="filter-chip"
           th:classappend="${selectedStatus != null and selectedStatus == s} ? ' active'"
           th:text="${s.label()}">상태</a>
    </div>

    <div class="data-table-wrap">
        <table class="data-table">
            <thead>
            <tr><th>주문번호</th><th>주문자</th><th>주문일시</th><th class="num">금액</th><th>상태</th><th>상태 변경</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="${order.orderNumber}">ORD-0000</td>
                <td th:text="${order.buyerName}">주문자</td>
                <td th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}">2026-01-01</td>
                <td class="num" th:text="${#numbers.formatInteger(order.totalPrice, 0, 'COMMA')} + '원'">0원</td>
                <td><span class="status-badge" th:classappend="${#strings.toLowerCase(order.status)}" th:text="${order.statusLabel}">상태</span></td>
                <td class="order-status-cell">
                    <form class="order-status-form" th:action="@{/admin/orders/{id}/status(id=${order.orderId})}" method="post">
                        <div class="order-status-form__field">
                            <label>상태</label>
                            <select name="next" class="order-status-next">
                                <option value="ORDERED" th:selected="${order.status == 'ORDERED'}">주문완료</option>
                                <option value="SHIPPING" th:selected="${order.status == 'SHIPPING'}">배송중</option>
                                <option value="DELIVERED" th:selected="${order.status == 'DELIVERED'}">배송완료</option>
                                <option value="CANCELLED" th:selected="${order.status == 'CANCELLED'}">주문취소</option>
                            </select>
                        </div>
                        <div class="order-status-form__tracking">
                            <div class="order-status-form__field">
                                <label>택배사</label>
                                <select name="carrierCode">
                                    <option value="">선택</option>
                                    <option th:each="c : ${T(com.mondaycloset.shop.domain.order.Carrier).values()}"
                                            th:value="${c.code}" th:text="${c.label}"
                                            th:selected="${order.carrierCode == c.code}">CJ대한통운</option>
                                </select>
                            </div>
                            <div class="order-status-form__field order-status-form__field--grow">
                                <label>운송장번호</label>
                                <input type="text" name="trackingNumber" placeholder="운송장번호 입력" maxlength="50" th:value="${order.trackingNumber}">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-sm">변경 저장</button>
                    </form>
                </td>
                <td class="order-cancel-cell">
                    <form th:if="${order.status == 'ORDERED'}" th:action="@{/admin/orders/{id}/status(id=${order.orderId})}" method="post"
                          onsubmit="return confirm('이 주문을 취소할까요? 재고가 자동으로 복원됩니다.');">
                        <input type="hidden" name="next" value="CANCELLED">
                        <button type="submit" class="btn btn-sm btn-danger">즉시 취소</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <script th:src="@{/js/admin-order-status.js}"></script>

    <div class="pagination" th:if="${totalPages > 1}">
        <a th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
           th:href="@{/admin/orders(page=${i}, status=${selectedStatus})}"
           th:text="${i + 1}"
           th:classappend="${i == currentPage} ? 'active'">1</a>
    </div>

</div>
</body>
</html>
