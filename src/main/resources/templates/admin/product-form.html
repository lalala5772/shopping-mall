<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head><title>상품 등록/수정</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <h1 th:text="${productForm.id != null} ? '상품 수정' : '상품 등록'">상품 등록</h1>
    </div>

    <form th:action="${productForm.id != null} ? @{/admin/products/{id}(id=${productForm.id})} : @{/admin/products}"
          th:object="${productForm}" method="post" class="form-page" style="max-width:560px;">

        <div class="form-group">
            <label for="categoryId">카테고리</label>
            <select id="categoryId" th:field="*{categoryId}">
                <option value="">선택</option>
                <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}">카테고리</option>
            </select>
            <div class="field-error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}">error</div>
        </div>

        <div class="form-group">
            <label for="name">상품명</label>
            <input type="text" id="name" th:field="*{name}">
            <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">error</div>
        </div>

        <div class="form-group">
            <label for="price">가격 (원)</label>
            <input type="number" id="price" th:field="*{price}" min="0">
            <div class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">error</div>
        </div>

        <div class="form-group">
            <label for="stockQuantity">재고 수량</label>
            <input type="number" id="stockQuantity" th:field="*{stockQuantity}" min="0">
            <div class="field-error" th:if="${#fields.hasErrors('stockQuantity')}" th:errors="*{stockQuantity}">error</div>
        </div>

        <div class="form-group">
            <label for="thumbnailUrl">대표 이미지 URL</label>
            <input type="text" id="thumbnailUrl" th:field="*{thumbnailUrl}" placeholder="https://...">
        </div>

        <div class="form-group">
            <label for="description">상품 설명</label>
            <textarea id="description" th:field="*{description}"></textarea>
        </div>

        <button type="submit" class="btn btn-block">저장</button>
    </form>

</div>
</body>
</html>
