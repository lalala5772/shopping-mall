<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head><title>상품 관리</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <h1>상품 관리</h1>
        <a th:href="@{/admin/products/new}" class="btn btn-sm">+ 신규 등록</a>
    </div>

    <div class="data-table-wrap">
        <table class="data-table">
            <thead>
            <tr><th>ID</th><th>카테고리</th><th>상품명</th><th class="num">가격</th><th class="num">재고</th><th>상태</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.id}">1</td>
                <td th:text="${product.categoryName}">카테고리</td>
                <td th:text="${product.name}">상품명</td>
                <td class="num" th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')} + '원'">0원</td>
                <td class="num" th:text="${product.stockQuantity}">0</td>
                <td>
                    <span class="status-badge"
                          th:classappend="${product.hidden} ? 'hidden_status' : (${product.stockQuantity == 0} ? 'sold_out' : 'on_sale')"
                          th:text="${product.statusLabel}">판매중</span>
                </td>
                <td class="actions">
                    <a th:href="@{/admin/products/{id}/edit(id=${product.id})}" class="btn btn-sm btn-outline">수정</a>
                    <form th:if="${!product.hidden}" th:action="@{/admin/products/{id}/hide(id=${product.id})}" method="post"
                          onsubmit="return confirm('이 상품을 판매 중지(숨김) 처리할까요?');">
                        <button type="submit" class="btn btn-sm btn-danger">숨김</button>
                    </form>
                    <form th:if="${product.hidden}" th:action="@{/admin/products/{id}/show(id=${product.id})}" method="post">
                        <button type="submit" class="btn btn-sm btn-outline">노출 재개</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="pagination" th:if="${totalPages > 1}">
        <a th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
           th:href="@{/admin/products(page=${i})}"
           th:text="${i + 1}"
           th:classappend="${i == currentPage} ? 'active'">1</a>
    </div>

</div>
</body>
</html>
