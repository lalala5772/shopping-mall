<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head><title>Shop</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <h1>Shop</h1>
    </div>

    <div class="filter-bar">
        <a th:href="@{/products}" class="filter-chip" th:classappend="${selectedCategory == null and imageSearchActive == null} ? ' active'">전체</a>
        <a th:each="category : ${categories}"
           th:href="@{/products(category=${category.id})}"
           class="filter-chip"
           th:classappend="${selectedCategory != null and selectedCategory == category.id} ? ' active'"
           th:text="${category.name}">카테고리</a>

        <form th:action="@{/products}" method="get" class="search-form">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="상품명 검색">
            <button type="submit" class="btn btn-sm btn-outline">검색</button>
        </form>

        <form th:if="${imageSearchEnabled}" id="imageSearchForm" th:action="@{/products/search/image}" method="post"
              enctype="multipart/form-data" class="image-search">
            <input type="file" name="image" id="imageSearchInput" accept="image/*" hidden>
            <button type="button" id="imageSearchTrigger" class="image-search-trigger"
                    title="이미지로 검색" aria-label="이미지로 검색">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                    <path d="M4 7.5a1.5 1.5 0 0 1 1.5-1.5h1.8l1-1.6a1 1 0 0 1 .85-.4h5.7a1 1 0 0 1 .85.4l1 1.6h1.8A1.5 1.5 0 0 1 20 7.5v10A1.5 1.5 0 0 1 18.5 19h-13A1.5 1.5 0 0 1 4 17.5v-10Z"/>
                    <circle cx="12" cy="12.5" r="3.4"/>
                </svg>
            </button>
            <div id="imageSearchPreview" class="image-search-preview" hidden>
                <img id="imageSearchThumb" alt="선택한 이미지 미리보기">
                <span id="imageSearchFilename"></span>
                <button type="button" id="imageSearchClear" aria-label="선택 취소">×</button>
            </div>
            <span id="imageSearchError" class="image-search-error" hidden></span>
        </form>
    </div>

    <div th:if="${imageSearchActive}" class="alert image-search-result-banner">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7.5a1.5 1.5 0 0 1 1.5-1.5h1.8l1-1.6a1 1 0 0 1 .85-.4h5.7a1 1 0 0 1 .85.4l1 1.6h1.8A1.5 1.5 0 0 1 20 7.5v10A1.5 1.5 0 0 1 18.5 19h-13A1.5 1.5 0 0 1 4 17.5v-10Z"/><circle cx="12" cy="12.5" r="3.4"/></svg>
        업로드한 이미지와 유사한 상품 결과입니다. <a th:href="@{/products}">전체 상품 보기</a>
    </div>

    <div th:if="${#lists.isEmpty(products)}" class="empty-state">조건에 맞는 상품이 없습니다.</div>

    <div class="product-grid" th:unless="${#lists.isEmpty(products)}">
        <a th:each="product : ${products}" th:href="@{/products/{id}(id=${product.id})}" style="color:inherit;">
            <div class="product-card">
                <div class="product-card__image-wrap">
                    <span th:if="${product.soldOut}" class="badge-soldout">SOLD OUT</span>
                    <img th:src="${product.thumbnailUrl}" th:alt="${product.name}">
                </div>
                <div class="product-card__info">
                    <p class="product-card__name" th:text="${product.name}">상품명</p>
                    <p class="product-card__price" th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')} + '원'">0원</p>
                </div>
            </div>
        </a>
    </div>

    <div class="pagination" th:if="${totalPages > 1}">
        <a th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
           th:href="@{/products(page=${i}, category=${selectedCategory}, keyword=${keyword})}"
           th:text="${i + 1}"
           th:classappend="${i == currentPage} ? 'active'">1</a>
    </div>

    <script th:if="${imageSearchEnabled}" th:src="@{/js/image-search.js}"></script>
</div>
</body>
</html>
